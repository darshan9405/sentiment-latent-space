<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internet Sentiment Latent Space</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050505;
      color: #e0e0e0;
      overflow: hidden;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      max-width: 360px;
      background: rgba(10, 10, 14, 0.85);
      backdrop-filter: blur(6px);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .meta {
      font-size: 12px;
      color: #8a8a9a;
      margin-bottom: 12px;
    }
    label { font-size: 13px; display: block; margin-bottom: 4px; }
    select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #2a2a35;
      background: #14141a;
      color: #fff;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
    }
    button:disabled { background: #2a2a35; cursor: not-allowed; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #a0a0b0;
    }
    #tooltip {
      position: absolute;
      z-index: 20;
      max-width: 320px;
      background: rgba(15, 15, 22, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px;
      pointer-events: none;
      display: none;
    }
    #tooltip h3 {
      font-size: 14px;
      margin-bottom: 6px;
      color: #fff;
    }
    #tooltip p {
      font-size: 12px;
      line-height: 1.4;
      color: #c0c0d0;
      margin-bottom: 6px;
    }
    #tooltip a {
      font-size: 11px;
      color: #60a5fa;
      text-decoration: none;
      word-break: break-all;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      text-align: center;
      display: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Internet Sentiment Latent Space</h1>
    <div class="meta">Explore trending topics projected into a 3D semantic space.</div>
    <label for="country">Country</label>
    <select id="country">
      <option value="IN">India</option>
    </select>
    <button id="refresh">Refresh Snapshot</button>
    <div id="status">Loading...</div>
  </div>

  <div id="tooltip"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div>Generating latent space...</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
